<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daimala Sales Entry</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#6b6a64;--ac:#0f6e56;--acx:#fff;--bd:#d9d7cf;--bad:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171715;--card:#22221f;--tx:#eeede8;--mut:#a09f97;--ac:#3fb593;--acx:#0b1f19;--bd:#3a3a35;--bad:#f2867f}}
:root[data-theme="dark"]{--bg:#171715;--card:#22221f;--tx:#eeede8;--mut:#a09f97;--ac:#3fb593;--acx:#0b1f19;--bd:#3a3a35;--bad:#f2867f}
*{box-sizing:border-box}html{color-scheme:light dark}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding:12px}
main{max-width:640px;margin:0 auto}h1{font-size:20px;margin:4px 0 12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,button{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx)}
.row{display:flex;gap:8px}.row>*{flex:1}
button{background:var(--ac);color:var(--acx);border:0;font-weight:600;margin-top:12px}
button.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.mut{color:var(--mut);font-size:13px}.big{font-size:18px;font-weight:600}.bad{color:var(--bad)}
.s{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--bd);padding:8px 0}
.s button{width:auto;margin:0;padding:4px 10px;background:transparent;color:var(--bad);border:1px solid var(--bd)}
.btn{display:block;text-align:center;text-decoration:none;background:var(--ac);color:var(--acx);font-weight:600;padding:10px;border-radius:8px;margin-top:12px}.btn.sec{background:transparent;color:var(--tx);border:1px solid var(--bd)}
</style></head><body><main>
<h1>Daimala Sales Entry</h1>
<div id="login" class="card" hidden><div class="big">Sign in</div><label>Email</label><input id="em" type="email" autocomplete="username"><label>Password</label><input id="pw" type="password" autocomplete="current-password"><button id="si">Sign in</button><div id="lerr" class="bad"></div></div>
<div id="msg" class="card mut">Loading…</div>
<div id="app" hidden>
<div class="mut"><span id="who"></span> · <a href="#" id="so">Sign out</a></div>
<div class="card"><label>Today’s rate (SSP per $1)</label>
<div class="row"><input id="rate" type="number" inputmode="decimal" min="0" step="any" placeholder="e.g. enter today’s rate"><button id="saveRate" style="margin:0;flex:0 0 90px">Save</button></div>
<div class="mut" id="rateInfo"></div></div>
<div class="card">
<label>Date</label><input id="date" type="date">
<label>Item (type a code or name)</label><input id="item" list="items" autocomplete="off" placeholder="e.g. D1-12">
<datalist id="items"></datalist>
<div id="stock" class="mut"></div>
<div class="row"><div><label>Unit</label><select id="unit"><option>Carton</option><option>Dozen</option><option>Piece</option></select></div>
<div><label>Quantity</label><input id="qty" type="number" inputmode="decimal" min="0" step="any" value="1"></div></div>
<div class="row"><div><label>Customer pays in</label><select id="ccy"><option>SSP</option><option>USD</option></select></div>
<div><label>Price charged per unit (<span id="cl">SSP</span>)</label><input id="price" type="number" inputmode="decimal" min="0" step="any"></div></div>
<div class="mut" id="std"></div>
<div class="big" id="tot"></div>
<button id="add">Add to basket</button><div id="err" class="bad"></div></div>
<div class="card"><div class="big">Basket</div><div id="bk"></div><button id="done" hidden>Complete sale &amp; make receipt</button></div>
<div class="card" id="rcard" hidden><div class="big">Receipt</div><pre id="rt" style="font:13px/1.25 ui-monospace,Menlo,monospace;white-space:pre;overflow-x:auto"></pre>
<a id="raw" class="btn" href="#">Print with RawBT</a><a id="rawA" class="btn sec" href="#">Print with RawBT (alternate link)</a><button class="sec" id="sv">Save receipt file (.txt)</button><button class="sec" id="shr">Share / send to printer app</button><button class="sec" id="cpy">Copy receipt text</button><div id="rmsg" class="mut"></div></div>
<div class="card"><div class="big">Sales entered today</div><div class="mut" id="sum"></div><div id="list"></div>
<button class="sec" id="exp">Export all sales (CSV)</button><textarea id="out" hidden readonly style="width:100%;height:120px;margin-top:8px"></textarea></div>
<div class="card"><div class="big">Admin: import item list</div><div class="mut">Choose catalog.json. This replaces the item list and sets stock from the file.</div><input id="imp" type="file" accept=".json,application/json"><div id="impm" class="mut"></div></div>
</div>
<script>
const $=id=>document.getElementById(id),msg=$('msg');
const firebaseConfig={apiKey:"AIzaSyBTEXkyO8G3xrmlkJdmSB_RNPpZXeILvIc",authDomain:"daimala-sales.firebaseapp.com",projectId:"daimala-sales",storageBucket:"daimala-sales.firebasestorage.app",messagingSenderId:"63248553363",appId:"1:63248553363:web:04161d6ef86a14fa4b4466"};
firebase.initializeApp(firebaseConfig);
const auth=firebase.auth(),db=firebase.firestore();
try{db.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
let started=false,me=null;
$('si').onclick=async()=>{$('lerr').textContent='';try{await auth.signInWithEmailAndPassword($('em').value.trim(),$('pw').value)}catch(e){$('lerr').textContent='Sign-in failed ('+(e.code||'error')+'). Check email and password.'}};
$('so').onclick=e=>{e.preventDefault();auth.signOut()};
auth.onAuthStateChanged(u=>{msg.hidden=true;if(!u){$('app').hidden=true;$('login').hidden=false;return}
 me={name:(u.email||'staff').split('@')[0]};$('who').textContent='Signed in as '+u.email;$('login').hidden=true;$('app').hidden=false;if(!started){started=true;start()}});
function saveFile(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/plain'}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function start(){
let items={},sales=[],rate=0,cur=null,asOf=0,basket=[],txt='',pending=null,touched=false;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const say=t=>{$('rmsg').textContent=t};
const dayOf=t=>{const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('date').value=today();
const f=(n,d=2)=>Number(n).toLocaleString('en',{maximumFractionDigits:d});
const fac=(it,u)=>u==='Carton'?it.F:u==='Dozen'?it.H:1;
const stdUsd=(it,u)=>u==='Carton'?it.pcn:u==='Dozen'?it.pd:it.pc;
function find(){const v=$('item').value.trim().toLowerCase();return items[Object.keys(items).find(c=>c.toLowerCase()===v||(c+' | '+items[c].name).toLowerCase()===v)]||null}
function sold(code){return sales.filter(s=>s.code===code&&(s.ts||0)>=asOf).reduce((a,s)=>a+s.qty*(s.fac||1),0)+basket.filter(l=>l.code===code).reduce((a,l)=>a+l.qty*l.fac,0)}
function refresh(){
 cur=find();const u=$('unit').value,c=$('ccy').value;$('cl').textContent=c;
 if(!cur){$('stock').textContent='';$('std').textContent='';$('tot').textContent='';return}
 const left=cur.stock-sold(cur.code);$('stock').textContent='In stock: '+f(left/cur.F,2)+' cartons ('+f(left,0)+' pieces)';
 const s=stdUsd(cur,u);$('std').textContent='Standard price: $'+f(s,4)+' per '+u.toLowerCase()+(rate?' = SSP '+f(s*rate,0):'');
 const p=+$('price').value,q=+$('qty').value;
 if(p&&q){const usd=c==='USD'?p:(rate?p/rate:0);$('tot').textContent='Total: '+f(p*q,c==='USD'?2:0)+' '+c+(c==='SSP'&&rate?'  (≈ $'+f(usd*q)+')':'')}else $('tot').textContent='';
}
function autoPrice(force){if(!cur||(touched&&!force))return;const s=stdUsd(cur,$('unit').value);$('price').value=$('ccy').value==='USD'?+s.toFixed(4):(rate?Math.round(s*rate):'');refresh()}
['item','unit','ccy'].forEach(i=>$(i).addEventListener('input',()=>{touched=false;if(i==='item'&&!find())return refresh();autoPrice(true)}));
$('price').addEventListener('input',()=>{touched=true;refresh()});$('qty').addEventListener('input',refresh);
db.doc('catalog/items').onSnapshot(s=>{items={};const dd=s.data()||{};asOf=+dd.asOf||0;(dd.list||[]).forEach(x=>items[x.code]=x);
 $('items').innerHTML=Object.keys(items).sort().map(c=>'<option value="'+esc(c)+'">'+esc(items[c].name)+'</option>').join('');refresh()},e=>{msg.hidden=false;msg.textContent='Cannot load data ('+(e.code||'error')+'). Check the Firestore rules and your sign-in.'});
db.doc('settings/rate').onSnapshot(d=>{const x=d.data();if(x){rate=+x.rate;if(document.activeElement!==$('rate'))$('rate').value=rate;$('rateInfo').textContent='Set by '+(x.by||'?')+' on '+(x.day||'')}autoPrice(false)});
$('saveRate').onclick=async()=>{const r=+$('rate').value;if(r>0)await db.doc('settings/rate').set({rate:r,by:me.name,day:today()})};
db.collection('sales').onSnapshot(s=>{sales=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);draw();refresh()});
function draw(){
 const t=today(),ts=sales.filter(s=>s.ts&&dayOf(s.ts)===t);let u=0,l=0;
 ts.forEach(s=>{u+=s.usd*s.qty;if(s.ccy==='SSP')l+=s.paid*s.qty});
 $('sum').textContent=ts.length+' lines · $'+f(u)+' total'+(l?' · SSP '+f(l,0)+' received':'');
 $('list').innerHTML=ts.map(s=>'<div class="s"><div>'+esc(s.code)+' · '+f(s.qty)+' '+esc(s.unit).toLowerCase()+'<div class="mut">'+f(s.paid,s.ccy==='USD'?2:0)+' '+esc(s.ccy)+' each · '+esc(s.by||'')+(s.date!==t?' · dated '+esc(s.date):'')+'</div></div><button data-d="'+esc(s.id)+'">Delete</button></div>').join('')||'<div class="mut">No sales yet today.</div>';
}
$('list').onclick=async e=>{const id=e.target.dataset.d;if(!id||!confirm('Delete this sale?'))return;const s=sales.find(x=>x.id===id);try{if(s){const {id:_i,...rest}=s;await db.doc('deleted/'+id).set({...rest,deletedBy:me.name,deletedAt:Date.now()})}await db.doc('sales/'+id).delete()}catch(x){$('err').textContent='Could not delete. Try again.'}};
$('add').onclick=async()=>{
 const err=$('err');err.textContent='';const c=$('ccy').value,p=+$('price').value,q=+$('qty').value,u=$('unit').value;
 if(!cur)return err.textContent='Pick an item from the list.';
 if(!(q>0&&p>0))return err.textContent='Enter quantity and price charged.';
 if(c==='SSP'&&!rate)return err.textContent='Save today’s rate first.';
 const left=cur.stock-sold(cur.code),need=q*fac(cur,u);
 if(need>left&&!confirm('Only '+f(left,0)+' pieces in stock. Add anyway?'))return;
 const usd=c==='USD'?p:p/rate;
 resetPending();basket.push({code:cur.code,name:cur.name,unit:u,qty:q,fac:fac(cur,u),ccy:c,paid:p,usd:+usd.toFixed(4),rate:rate,std:stdUsd(cur,u)});drawBasket();
 $('item').value='';cur=null;$('qty').value=1;$('price').value='';refresh();$('item').focus();
};
function drawBasket(){$('bk').innerHTML=basket.map((l,i)=>'<div class="s"><div>'+esc(l.code)+' · '+f(l.qty)+' '+esc(l.unit).toLowerCase()+'<div class="mut">'+f(l.paid,l.ccy==='USD'?2:0)+' '+esc(l.ccy)+' each</div></div><button data-r="'+i+'">Remove</button></div>').join('')||'<div class="mut">Basket is empty.</div>';$('done').hidden=!basket.length;if(cur)refresh()}
$('bk').onclick=e=>{const i=e.target.dataset.r;if(i!==undefined){resetPending();basket.splice(+i,1);drawBasket()}};
function rtext(no,d,L){const W=32,line='-'.repeat(W),A=s=>String(s).normalize('NFKD').replace(/[^\x20-\x7e]/g,''),c=t=>' '.repeat(Math.max(0,(W-t.length)>>1))+t,r2=(a,b)=>{a=A(a);b=A(b);return a+' '.repeat(Math.max(1,W-a.length-b.length))+b};
 const o=[c('DAIMALA ENTERPRISE'),c('Konyo-Konyo, Juba'),c('+211925252434'),c('+211925208814'),line,r2('Receipt '+no,d),A('Seller: '+(me.name)),line];let u=0,s=0;
 L.forEach(l=>{o.push(A(l.name).slice(0,W));const t=l.paid*l.qty,k=l.ccy==='USD'?2:0;if(l.ccy==='USD')u+=t;else s+=t;o.push(r2(f(l.qty)+' '+l.unit.toLowerCase()+' x '+f(l.paid,k),f(t,k)+' '+l.ccy))});
 o.push(line);if(u)o.push(r2('TOTAL USD',f(u)));if(s)o.push(r2('TOTAL SSP',f(s,0)));o.push(line,c('Thank you for shopping with us'),'','','');return o.join('\n')}
function newNo(d){const n=new Date(),p=x=>String(x).padStart(2,'0');return d.slice(2).replace(/-/g,'')+'-'+p(n.getHours())+p(n.getMinutes())+p(n.getSeconds())+Math.random().toString(36).slice(2,4).toUpperCase()}
function resetPending(){if(pending){pending.ids.forEach(id=>db.doc('sales/'+id).delete().catch(()=>{}));pending=null}}
$('done').onclick=async()=>{if(!basket.length)return;$('done').disabled=true;$('err').textContent='';
 const d=$('date').value||today();
 if(!pending||pending.d!==d){const no=newNo(d);pending={no,d,ts:Date.now(),ids:basket.map((_,i)=>no+'_'+i)}}
 const L=basket.slice(),P=pending;
 try{L.forEach((l,i)=>db.doc('sales/'+P.ids[i]).set({...l,date:d,rcpt:P.no,by:me.name,ts:P.ts+i}).catch(()=>{$('err').textContent='A sale line was rejected by the server. Check sign-in and rules.'}));
  basket=[];pending=null;drawBasket();txt=rtext(P.no,d,L);
  const b=btoa(txt);$('raw').href='rawbt:base64,'+b;$('rawA').href='intent:base64,'+b+'#Intent;scheme=rawbt;package=ru.a402d.rawbtprinter;end;';
  say('If the RawBT buttons do nothing, tap Save receipt file or Copy receipt text, then print from the RawBT app.');$('rt').textContent=txt;$('rcard').hidden=false;$('rcard').scrollIntoView()}
 catch(e){$('err').textContent='Could not save the whole sale. Nothing was duplicated: tap Complete again to retry.'}
 $('done').disabled=false};
const copy=async()=>{try{await navigator.clipboard.writeText(txt);say('Receipt text copied.')}catch(e){const r=document.createRange();r.selectNodeContents($('rt'));const g=getSelection();g.removeAllRanges();g.addRange(r);say('Copy not allowed here. Receipt text is selected: long-press and Copy.')}};
$('shr').onclick=async()=>{if(navigator.share){try{await navigator.share({title:'Receipt',text:txt});say('')}catch(e){if(e&&e.name!=='AbortError')say('Sharing is not available here.')}}else{say('Sharing not supported on this device.');copy()}};
$('cpy').onclick=copy;
$('sv').onclick=async()=>{try{saveFile('receipt_'+Date.now()+'.txt',txt);say('Receipt file saved. Open it with RawBT to print.')}catch(e){say('Saving failed. Use Copy receipt text.')}};
['raw','rawA'].forEach(id=>$(id).addEventListener('click',()=>{say('Opening RawBT… If nothing happens, install RawBT, or use Share and pick RawBT.')}));
drawBasket();
$('exp').onclick=async()=>{
 const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
 const rows=[['Date','Receipt','Item','Unit','Qty','Price charged (USD per unit)','Payment','Note','Seller']];
 sales.slice().sort((a,b)=>a.ts-b.ts).forEach(s=>rows.push([s.date,s.rcpt||'',s.code+' | '+s.name,s.unit,s.qty,s.usd,s.ccy,s.ccy==='SSP'?'SSP '+f(s.paid,0)+' each at '+f(s.rate,2):'',s.by||'']));
 const csv=rows.map(r=>r.map(q).join(',')).join('\n');
 try{saveFile('daimala_sales_'+today()+'.csv',csv);return}catch(e){}
 $('out').hidden=false;$('out').value=csv;$('out').select();
};
$('imp').onchange=async e=>{const fl=e.target.files[0];if(!fl)return;try{const j=JSON.parse(await fl.text());if(!Array.isArray(j.list)||!j.list.length)throw 0;if(!confirm('Replace the item list with '+j.list.length+' items?'))return;await db.doc('catalog/items').set({asOf:Date.now(),list:j.list});$('impm').textContent='Imported '+j.list.length+' items.'}catch(x){$('impm').textContent='That file could not be imported.'}e.target.value=''};
}
</script></main></body></html>
